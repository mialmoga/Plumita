<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vectores</title>
<style>
:root{--bg:#24262b;--bar:#1a1c20;--ink:#e8e6e1;--dim:#8d929c;--acc:#5b8cff;--line:#33363d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.3 ui-rounded,"Avenir Next",system-ui,sans-serif;overscroll-behavior:none}
#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;top:0;left:0;right:0;display:flex;gap:4px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:var(--bar);border-bottom:1px solid var(--line);z-index:5}
button{font:inherit;color:var(--ink);background:#2a2d34;border:1px solid var(--line);border-radius:10px;min-width:44px;height:44px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{background:#3a3e48}
button:disabled{opacity:.35}
.sp{flex:1}
#fin{background:var(--acc);border-color:var(--acc);color:#fff;font-size:20px;display:none}
.top svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bot{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);padding:4px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
#hint{text-align:center;color:var(--dim);font-size:12px;padding:4px 6px 6px;min-height:24px}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tools button{flex-direction:column;height:56px;gap:2px;font-size:11px;padding:0;min-width:0}
.tools button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tools svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
dialog{background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(340px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.row{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
input{font:inherit;color:var(--ink);background:#2a2d34;border:1px solid var(--line);border-radius:10px;height:44px;width:100px;padding:0 10px;user-select:text;-webkit-user-select:text}
.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.chip{height:36px;font-size:12px}
[hidden]{display:none!important}
#size{font-size:12px;padding:0 6px}
#stybtn{border:5px solid #14161a;border-radius:12px;padding:0}
#sty{position:fixed;left:8px;right:8px;background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:8px 10px;z-index:6}
.srow{display:flex;align-items:center;gap:8px;margin:6px 0}
.srow>span{width:60px;color:var(--dim);font-size:12px;flex:none}
.sw{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.dot{min-width:0;width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--line)}
.dot.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.dot.none{background:repeating-linear-gradient(45deg,#666 0 3px,#2a2d34 3px 6px)}
.pick{width:30px;height:30px;padding:0;border:0;border-radius:50%;background:none}
#sw{flex:1;width:auto;height:30px;padding:0;background:none;border:0}
#swo{width:28px;text-align:right;font-size:12px}
.srow>button{flex:1;height:40px;padding:0 6px}
select{font:inherit;color:var(--ink);background:#2a2d34;border:1px solid var(--line);border-radius:10px;height:44px;padding:0 8px}
dialog{max-height:92vh;overflow:auto}
.chk{display:inline-flex;align-items:center;gap:8px}
.chk input{width:22px;height:22px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(76px + env(safe-area-inset-top));background:rgba(0,0,0,.82);color:#fff;padding:10px 14px;border-radius:12px;z-index:9;font-size:13px;max-width:90vw;text-align:center}
#sty{max-height:58vh;overflow:auto}
.srow>button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.srow select{flex:none;width:72px}
#size{max-width:96px;overflow:hidden}
.top>button{min-width:40px;padding:0 6px}
.top,.bot{transition:transform .2s}
.top.col{transform:translateY(-100%)}
.bot.col{transform:translateY(100%)}
.top .tab,.bot .tab{position:absolute;left:50%;transform:translateX(-50%);width:68px;min-width:0;height:22px;padding:0;font-size:11px;color:var(--dim);background:var(--bar);border:1px solid var(--line)}
.top .tab{top:100%;border-top:0;border-radius:0 0 10px 10px}
.bot .tab{bottom:100%;border-bottom:0;border-radius:10px 10px 0 0}
#fab{position:fixed;right:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:4}
#fab button{width:52px;height:52px;border-radius:26px;background:var(--bar);box-shadow:0 2px 8px rgba(0,0,0,.5);font-size:22px;padding:0}
#fab button.on{background:var(--acc);border-color:var(--acc)}
#fab #close{width:auto;padding:0 18px;font-size:14px}
</style></head><body>
<svg id="stage"><g id="world"><rect id="art" fill="#fff" style="filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))"/><image id="rimg" visibility="hidden" preserveAspectRatio="none" pointer-events="none"/><path id="grid" fill="none" stroke="#5b8cff" opacity=".3" pointer-events="none"/><g id="c"></g></g></svg>

<div class="top">
 <button class="tab" id="ttab" aria-label="Plegar barra superior">▲</button>
 <button id="undo" aria-label="Deshacer">↶</button>
 <button id="redo" aria-label="Rehacer">↷</button>
 <button id="fs" aria-label="Pantalla completa">⛶</button>
 <span class="sp"></span>
 <button id="size"></button>
 <button id="stybtn" aria-label="Color y grosor"></button>
 <button id="fin" aria-label="Terminar trazo">✓</button>
 <button id="trash" aria-label="Borrar trazo"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button>
</div>

<div class="bot">
 <button class="tab" id="btab" aria-label="Plegar barra inferior">▼</button>
 <div id="hint"></div>
 <div class="tools" id="tools">
  <button data-t="pen"><svg viewBox="0 0 24 24"><path d="M12 3l5 9-5 4-5-4z"/><path d="M12 16v5"/><circle cx="12" cy="10" r="1"/></svg>Pluma</button>
  <button data-t="line"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="5" r="1.5"/></svg>Línea</button>
  <button data-t="direct"><svg viewBox="0 0 24 24"><path d="M6 3l12 8-5 1.5L10 18z"/></svg>Nodos</button>
  <button data-t="conv"><svg viewBox="0 0 24 24"><path d="M4 19L10 6Q17 5 20 19"/></svg>Curva/Recta</button>
  <button data-t="add"><svg viewBox="0 0 24 24"><path d="M3 20Q12 8 21 20"/><path d="M12 2v6M9 5h6"/></svg>+ Nodo</button>
  <button data-t="del"><svg viewBox="0 0 24 24"><path d="M3 20Q12 8 21 20"/><path d="M9 5h6"/></svg>− Nodo</button>
 </div>
</div>

<div id="fab"><button id="close" hidden>Cerrar trazo</button><button id="hand" aria-label="Mover lienzo">✋</button></div>

<div id="sty" hidden>
 <div class="srow"><span>Relleno</span><div class="sw" id="fsw"></div></div>
 <div class="srow"><span>Contorno</span><div class="sw" id="ssw"></div></div>
 <div class="srow"><span>Grosor</span><input type="range" id="sw" min="0" max="60" step="1"><output id="swo"></output></div>
 <div class="srow"><span>Imagen</span><button id="rload">Cargar</button><button id="rmove">Mover</button><button id="rdel">Quitar</button></div>
 <div class="srow"><span>Opacidad</span><input type="range" id="rop" min="5" max="100"><output id="ropo"></output></div>
 <div class="srow"><span>Retícula</span><button id="gon">Cuadrícula</button><button id="gsnap">Imán</button><select id="gsz"><option>10</option><option>20</option><option>25</option><option>50</option><option>100</option></select></div>
 <input type="file" id="file" accept="image/*" hidden>
 <div class="srow"><span>Formas</span><button id="badd">Sumar</button><button id="bsub">Restar</button></div>
 <div class="srow"><button id="dup">Duplicar</button><button id="fwd">Al frente</button><button id="bck">Atrás</button></div>
</div>

<div id="toast" hidden></div>

<dialog id="dlg"><form method="dialog">
 <b>Tamaño del lienzo (px)</b>
 <div class="row"><input id="iw" type="number" inputmode="numeric" min="16" max="8000"> ×
 <input id="ih" type="number" inputmode="numeric" min="16" max="8000"></div>
 <div class="row" id="pre"></div>
 <b>Exportar</b>
 <div class="row"><label class="chk"><input type="checkbox" id="xbg"> Fondo blanco</label>
 <select id="xsc"><option value="1">PNG ×1</option><option value="2" selected>PNG ×2</option><option value="4">PNG ×4</option></select></div>
 <div class="row"><button type="button" id="xsvg">Descargar SVG</button><button type="button" id="xpng">Descargar PNG</button></div>
 <div class="row"><button value="x">Cancelar</button><button class="pri" value="ok">Aplicar</button></div>
</form></dialog>

<script>
const $=s=>document.querySelector(s);
const svg=$('#stage'),world=$('#world'),C=$('#c'),art=$('#art');
let doc={w:1080,h:1080,paths:[]},view={s:1,ox:0,oy:0},tool='pen',sel=null,selN=-1,cur=null,g=null,pinch=null,nid=1;
const style={fill:'#8fb3ff',stroke:'#14161a',sw:4};
const P=new Map();let H=[],hi=-1;
const HINT={pen:'Toca para poner nodos · arrastra para curvar · toca el primero para cerrar',line:'Arrastra para trazar una línea',direct:'Toca un trazo o nodo · arrastra nodos y jaladores',conv:'Toca un nodo: curva ↔ recta · arrástralo para sacar jaladores',add:'Toca sobre el trazo para añadir un nodo',del:'Toca un nodo para quitarlo'};

/* ---------- geometría ---------- */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const mk=p=>({x:p.x,y:p.y,i:[0,0],o:[0,0],s:false});
const segPts=(a,b)=>[[a.x,a.y],[a.x+a.o[0],a.y+a.o[1]],[b.x+b.i[0],b.y+b.i[1]],[b.x,b.y]];
function segList(p){const n=p.nodes,r=[];for(let i=0;i<n.length-1;i++)r.push([n[i],n[i+1]]);if(p.closed&&n.length>1)r.push([n[n.length-1],n[0]]);return r}
function dOf(n,closed){if(!n.length)return'';let d=`M${n[0].x} ${n[0].y}`;for(const[a,b]of segList({nodes:n,closed})){const q=segPts(a,b);d+=`C${q[1][0]} ${q[1][1]} ${q[2][0]} ${q[2][1]} ${q[3][0]} ${q[3][1]}`}return d+(closed?'Z':'')}
function pathD(p){return dOf(p.nodes,p.closed)+(p.holes||[]).map(h=>dOf(h,true)).join('')}
function bzAt(q,t){const a=lerp(q[0],q[1],t),b=lerp(q[1],q[2],t),c=lerp(q[2],q[3],t);return lerp(lerp(a,b,t),lerp(b,c,t),t)}
const N=24;
function nearest(p,pt){let best={d:1e9};segList(p).forEach(([a,b],si)=>{const q=segPts(a,b);let prev=bzAt(q,0);for(let j=1;j<=N;j++){const c=bzAt(q,j/N),dx=c[0]-prev[0],dy=c[1]-prev[1],L=dx*dx+dy*dy;let u=L?((pt.x-prev[0])*dx+(pt.y-prev[1])*dy)/L:0;u=Math.max(0,Math.min(1,u));const d=Math.hypot(pt.x-(prev[0]+dx*u),pt.y-(prev[1]+dy*u));if(d<best.d)best={d,si,t:(j-1+u)/N};prev=c}});return best}
function inside(p,pt){const pts=[];segList(p).forEach(([a,b])=>{const q=segPts(a,b);for(let j=0;j<N;j++)pts.push(bzAt(q,j/N))});let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>pt.y)!=(yj>pt.y)&&pt.x<(xj-xi)*(pt.y-yi)/(yj-yi)+xi)c=!c}return c}
function hitPath(pt){const tol=14/view.s;for(let i=doc.paths.length-1;i>=0;i--){const p=doc.paths[i];if(p.nodes.length>1&&nearest(p,pt).d<=tol+p.sw/2)return p;if(p.closed&&p.fill!=='none'&&inside(p,pt))return p}return null}
function hitNearest(pt,tol){let b=null;for(const p of doc.paths){if(p.nodes.length<2)continue;const r=nearest(p,pt);if(r.d<tol&&(!b||r.d<b.d))b={p,si:r.si,t:r.t,d:r.d}}return b}
function nodeHit(pt,tol){const order=sel?[sel,...doc.paths.filter(x=>x!==sel).reverse()]:[...doc.paths].reverse();for(const p of order)for(let k=p.nodes.length-1;k>=0;k--)if(dist(p.nodes[k],pt)<tol)return{p,k};return null}
function handleAt(p,k,pt,tol){const n=p.nodes[k];for(const w of['o','i']){const h=n[w];if((h[0]||h[1])&&Math.hypot(n.x+h[0]-pt.x,n.y+h[1]-pt.y)<tol)return w}return null}
function visIdx(p){if(selN<0||selN>=p.nodes.length)return[];const n=p.nodes.length,r=[selN],a=selN-1,b=selN+1;if(a>=0)r.push(a);else if(p.closed)r.push(n-1);if(b<n)r.push(b);else if(p.closed)r.push(0);return[...new Set(r)]}
function setHandle(n,w,v){n[w]=v;if(n.s){const o=w==='i'?'o':'i',l=Math.hypot(...n[o])||Math.hypot(...v),m=Math.hypot(...v)||1;n[o]=[-v[0]/m*l,-v[1]/m*l]}}
function addNodeAt(p,si,t){const n=p.nodes,a=n[si],b=n[(si+1)%n.length],q=segPts(a,b);
 const straight=!a.o[0]&&!a.o[1]&&!b.i[0]&&!b.i[1];
 const L1=lerp(q[0],q[1],t),L2=lerp(q[1],q[2],t),L3=lerp(q[2],q[3],t),M1=lerp(L1,L2,t),M2=lerp(L2,L3,t),S=lerp(M1,M2,t);
 const nn={x:S[0],y:S[1],i:[0,0],o:[0,0],s:false};
 if(!straight){a.o=[L1[0]-q[0][0],L1[1]-q[0][1]];nn.i=[M1[0]-S[0],M1[1]-S[1]];nn.o=[M2[0]-S[0],M2[1]-S[1]];b.i=[L3[0]-q[3][0],L3[1]-q[3][1]];nn.s=true}
 n.splice(si+1,0,nn);return si+1}
function autoSmooth(p,k){const n=p.nodes,c=n[k],pr=n[k-1]||(p.closed?n[n.length-1]:null),nx=n[k+1]||(p.closed?n[0]:null);if(!pr&&!nx)return;
 const A=pr||c,B=nx||c;let tx=B.x-A.x,ty=B.y-A.y;const tl=Math.hypot(tx,ty)||1;tx/=tl;ty/=tl;
 const lo=nx?dist(c,nx)/3:0,li=pr?dist(c,pr)/3:0;c.o=[tx*lo,ty*lo];c.i=[-tx*li,-ty*li];c.s=true}
function delNode(p,k){p.nodes.splice(k,1);selN=-1;if(p.nodes.length<2){doc.paths=doc.paths.filter(x=>x!==p);if(sel===p)sel=null;if(cur===p)cur=null}commit()}

/* ---------- historial / guardado ---------- */
function save(){try{localStorage.setItem('vec-doc',JSON.stringify(doc))}catch(e){}}
function commit(){H=H.slice(0,hi+1);H.push(JSON.stringify(doc));hi=H.length-1;if(H.length>80){H.shift();hi--}save();ui();draw()}
function restore(i){hi=i;doc=JSON.parse(H[i]);sel=null;selN=-1;cur=null;setArt();ui();draw()}
$('#undo').onclick=()=>{finishCur(true);if(hi>0)restore(hi-1)};
$('#redo').onclick=()=>{if(hi<H.length-1)restore(hi+1)};
$('#trash').onclick=()=>{if(!sel)return;doc.paths=doc.paths.filter(x=>x!==sel);if(cur===sel)cur=null;sel=null;selN=-1;commit()};
function finishCur(quiet){if(!cur)return;const c=cur;cur=null;if(c.nodes.length<2){doc.paths=doc.paths.filter(x=>x!==c);if(sel===c){sel=null;selN=-1}}if(!quiet)commit();else{ui();draw()}}
$('#fin').onclick=()=>finishCur();

/* ---------- interfaz ---------- */
function ui(){$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=H.length-1;$('#trash').disabled=!sel;$('#fin').style.display=cur?'inline-flex':'none';{const tg=cur||(hasSel()?sel:null);$('#close').hidden=!(tg&&!tg.closed&&tg.nodes.length>2)}$('#hand').classList.toggle('on',handOn);
 $('#size').textContent=`${doc.w}×${doc.h}`;$('#hint').textContent=handOn?'Mano: arrastra para mover el lienzo · pellizca para hacer zoom':refMove?'Imagen: arrastra para moverla · pellizca para escalarla':HINT[tool];
 document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t===tool));updateSty()}
$('#tools').onclick=e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.t;if(t!==tool)finishCur();tool=t;handOn=false;ui();draw()};
function setArt(){art.setAttribute('width',doc.w);art.setAttribute('height',doc.h)}
function fit(){const W=innerWidth,Hh=innerHeight,top=topCol?22:$('.top').offsetHeight,bot=botCol?22:$('.bot').offsetHeight,av=Hh-top-bot-24;const s=Math.min((W-32)/doc.w,av/doc.h);view.s=s;view.ox=(W-doc.w*s)/2;view.oy=top+12+(av-doc.h*s)/2;draw()}
const dlg=$('#dlg');
$('#size').onclick=()=>{$('#iw').value=doc.w;$('#ih').value=doc.h;dlg.returnValue='';dlg.showModal()};
[[1080,1080],[1920,1080],[1080,1920],[512,512],[794,1123]].forEach(([w,h])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=`${w}×${h}`;b.onclick=()=>{$('#iw').value=w;$('#ih').value=h};$('#pre').appendChild(b)});
dlg.addEventListener('close',()=>{if(dlg.returnValue!=='ok')return;const cl=v=>Math.max(16,Math.min(8000,Math.round(+v)||1080));doc.w=cl($('#iw').value);doc.h=cl($('#ih').value);setArt();commit();fit()});

/* ---------- dibujo ---------- */
function draw(){
 world.setAttribute('transform',`translate(${view.ox} ${view.oy}) scale(${view.s})`);
 const k=1/view.s;let h='';drawRef();drawGrid(k);
 for(const p of doc.paths)h+=`<path d="${pathD(p)}" fill-rule="evenodd" fill="${p.fill}" stroke="${p.stroke}" stroke-width="${p.sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
 if(sel&&doc.paths.includes(sel)){const A='#5b8cff',hs=5*k;
  for(const i of visIdx(sel)){const n=sel.nodes[i];for(const w of['i','o']){const q=n[w];if(q[0]||q[1]){const hx=n.x+q[0],hy=n.y+q[1];h+=`<line x1="${n.x}" y1="${n.y}" x2="${hx}" y2="${hy}" stroke="${A}" stroke-width="${1.5*k}"/><circle cx="${hx}" cy="${hy}" r="${6*k}" fill="#fff" stroke="${A}" stroke-width="${1.8*k}"/>`}}}
  sel.nodes.forEach((n,i)=>{h+=`<rect x="${n.x-hs}" y="${n.y-hs}" width="${2*hs}" height="${2*hs}" fill="${i===selN?A:'#fff'}" stroke="${A}" stroke-width="${1.8*k}"/>`});
  if(cur&&cur.nodes.length>2){const f=cur.nodes[0];h+=`<circle cx="${f.x}" cy="${f.y}" r="${12*k}" fill="none" stroke="${A}" stroke-width="${1.5*k}" stroke-dasharray="${3*k} ${3*k}"/>`}}
 C.innerHTML=h}

/* ---------- gestos ---------- */
const toDoc=e=>({x:(e.clientX-view.ox)/view.s,y:(e.clientY-view.oy)/view.s});
svg.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
 if(P.size===2){dropPenTouch();endG(true);const[a,b]=[...P.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,m:[(a[0]+b[0])/2,(a[1]+b[1])/2],v:{...view},r:(refMove&&ref)?{x:ref.x,y:ref.y,w:ref.w,h:ref.h}:null};return}
 if(P.size>2||pinch)return;
 if(handOn||e.button===1||e.button===2){g={t:'pan',last:[e.clientX,e.clientY]};return}
 down(toDoc(e))});
svg.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,[e.clientX,e.clientY]);
 if(pinch&&pinch.r){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1])||1,m=[(a[0]+b[0])/2,(a[1]+b[1])/2],k=d/pinch.d,v=pinch.v,r=pinch.r;ref.w=r.w*k;ref.h=r.h*k;ref.x=(m[0]-v.ox)/v.s-((pinch.m[0]-v.ox)/v.s-r.x)*k;ref.y=(m[1]-v.oy)/v.s-((pinch.m[1]-v.oy)/v.s-r.y)*k;draw();return}

 else if(t==='h'){const n=g.n;if(tool==='conv')n.s=false;setHandle(n,g.w,[pt.x-n.x,pt.y-n.y]);g.m=true}
 else if(t==='n'){const n=g.n;if(grid.snap){n.x=pt.x;n.y=pt.y}else{n.x+=pt.x-g.last.x;n.y+=pt.y-g.last.y}g.last=pt;g.m=true}

function endG(cancel){if(!g)return;const q=g;g=null;

 if(q.t==='line'){const[a,b]=q.p.nodes;if(!q.m||dist(a,b)*view.s<8){doc.paths=doc.paths.filter(x=>x!==q.p);sel=null;selN=-1;ui();draw()}else commit();return}

 if(q.m)commit();else{ui();draw()}}

let pend=null,tt;

/*BOOL*/
const dd=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]),FL=24;
const segsOf=nodes=>nodes.map((a,i)=>segPts(a,nodes[(i+1)%nodes.length]));
const polyOf=S=>S.flatMap(q=>Array.from({length:FL},(_,j)=>bzAt(q,j/FL)));
function area(P){let a=0;for(let i=0,j=P.length-1;i<P.length;j=i++)a+=P[j][0]*P[i][1]-P[i][0]*P[j][1];return a/2}
function inPoly(P,pt){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if((yi>pt[1])!=(yj>pt[1])&&pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi)c=!c}return c}
const cloneN=n=>n.map(x=>({x:x.x,y:x.y,i:[...x.i],o:[...x.o],s:x.s}));
const revN=n=>n.map(x=>({x:x.x,y:x.y,i:[...x.o],o:[...x.i],s:x.s})).reverse();
function orient(n){n=cloneN(n);return area(polyOf(segsOf(n)))<0?revN(n):n}
function segX(p,q,r,s){const d1=[q[0]-p[0],q[1]-p[1]],d2=[s[0]-r[0],s[1]-r[1]],den=d1[0]*d2[1]-d1[1]*d2[0];if(Math.abs(den)<1e-12)return null;const t=((r[0]-p[0])*d2[1]-(r[1]-p[1])*d2[0])/den,u=((r[0]-p[0])*d1[1]-(r[1]-p[1])*d1[0])/den;return t>=0&&t<=1&&u>=0&&u<=1?[t,u]:null}
function dbz(q,t){const m=1-t;return[0,1].map(c=>3*(m*m*(q[1][c]-q[0][c])+2*m*t*(q[2][c]-q[1][c])+t*t*(q[3][c]-q[2][c])))}

 ta=Math.max(0,Math.min(1,ta+(f0*db[1]-db[0]*f1)/det));tb=Math.max(0,Math.min(1,tb+(-da[0]*f1+da[1]*f0)/det))}return[ta,tb]}
function xsect(SA,SB){const r=[],fl=q=>Array.from({length:FL+1},(_,j)=>bzAt(q,j/FL)),FB=SB.map(fl);

function splitAt(q,t){const L1=lerp(q[0],q[1],t),L2=lerp(q[1],q[2],t),L3=lerp(q[2],q[3],t),M1=lerp(L1,L2,t),M2=lerp(L2,L3,t),S=lerp(M1,M2,t);return[[q[0],L1,M1,S],[S,M2,L3,q[3]]]}
function pieces(S,cuts){const out=[];S.forEach((q,i)=>{const ts=[];(cuts[i]||[]).slice().sort((a,b)=>a-b).forEach(t=>{if(t>.002&&t<.998&&(!ts.length||t-ts[ts.length-1]>.001))ts.push(t)});let prev=0,rest=q;for(const t of ts){const[l,r]=splitAt(rest,(t-prev)/(1-prev));out.push(l);rest=r;prev=t}out.push(rest)});return out}
const rev=q=>[q[3],q[2],q[1],q[0]];
function loops(ps){const used=new Set(),res=[],tol=.1;for(let s=0;s<ps.length;s++){if(used.has(s))continue;used.add(s);const ch=[ps[s]];let end=ps[s][3],ok=false;

const straight=q=>{const dx=q[3][0]-q[0][0],dy=q[3][1]-q[0][1],L=Math.hypot(dx,dy)||1;return Math.abs(dx*(q[1][1]-q[0][1])-dy*(q[1][0]-q[0][0]))/L<.01&&Math.abs(dx*(q[2][1]-q[0][1])-dy*(q[2][0]-q[0][0]))/L<.01};

 return r.outer.length||r.holes.length?r:null}
/*ENDBOOL*/

function startOp(op){finishCur();if(!hasSel()||!sel.closed){toast('Selecciona primero una forma cerrada');return}pend=op;styOpen=false;updateSty();toast(op==='add'?'Toca la forma que quieres sumar':'Toca la forma que quieres restar')}
$('#badd').onclick=()=>startOp('add');$('#bsub').onclick=()=>startOp('sub');
function doBool(op,A,B){let r;try{r=bool(op,A,B)}catch(e){r=null}
 if(!r){toast('No se pudo: las formas no se cruzan');draw();return}
 const idx=doc.paths.indexOf(A);doc.paths=doc.paths.filter(x=>x!==A&&x!==B);
 const outs=r.outer.map(nodes=>({id:nid++,nodes,closed:true,fill:A.fill,stroke:A.stroke,sw:A.sw}));
 if(outs.length&&r.holes.length)outs[0].holes=r.holes;
 doc.paths.splice(Math.min(idx,doc.paths.length),0,...outs);sel=outs[0]||null;selN=-1;
 if(!outs.length)toast('El resultado quedó vacío');commit()}
