<style>
:root{--bg:#24262b;--bar:#1a1c20;--ink:#e8e6e1;--dim:#8d929c;--acc:#5b8cff;--line:#33363d}

.top{position:fixed;top:0;left:0;right:0;display:flex;gap:4px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:var(--bar);border-bottom:1px solid var(--line);z-index:5}

.bot{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);padding:4px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}

#sw{flex:1;width:auto;height:30px;padding:0;background:none;border:0}

.srow>button{flex:1;height:40px;padding:0 6px}
select{font:inherit;color:var(--ink);background:#2a2d34;border:1px solid var(--line);border-radius:10px;height:44px;padding:0 8px}
dialog{max-height:92vh;overflow:auto}

.chk input{width:22px;height:22px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(76px + env(safe-area-inset-top));background:rgba(0,0,0,.82);color:#fff;padding:10px 14px;border-radius:12px;z-index:9;font-size:13px;max-width:90vw;text-align:center}

.srow>button.on{background:var(--acc);border-color:var(--acc);color:#fff}

#size{max-width:96px;overflow:hidden}
.top>button{min-width:40px;padding:0 6px}
.top,.bot{transition:transform .2s}
.top.col{transform:translateY(-100%)}
.bot.col{transform:translateY(100%)}

.bot .tab{bottom:100%;border-bottom:0;border-radius:10px 10px 0 0}

#used{min-height:30px}

 <div class="srow"><span>Código</span><input class="hex" id="hexf" placeholder="Relleno #ff8000" maxlength="9" autocapitalize="off" autocomplete="off" spellcheck="false"><input class="hex" id="hexs" placeholder="Contorno #000" maxlength="9" autocapitalize="off" autocomplete="off" spellcheck="false"></div>

 <div class="srow"><span>Retícula</span><button id="gon">Cuadrícula</button><button id="gsnap">Imán</button><select id="gsz"><option>10</option><option>20</option><option>25</option><option>50</option><option>100</option></select></div>
 <input type="file" id="file" accept="image/*" hidden>

</div>

 <b>Tamaño del lienzo (px)</b>

</form></dialog>

<script>
const $=s=>document.querySelector(s);
const svg=$('#stage'),world=$('#world'),C=$('#c'),art=$('#art');
let doc={w:1080,h:1080,paths:[]},view={s:1,ox:0,oy:0},tool='pen',sel=null,selN=-1,selH=null,cur=null,g=null,pinch=null,nid=1;
const style={fill:'#8fb3ff',stroke:'#14161a',sw:4};
const P=new Map();let H=[],hi=-1;
const HINT={move:'Toca una forma · arrastra para moverla · círculo para rotar · esquinas para escalar',pen:'Toca para poner nodos · arrastra para curvar · toca el primero para cerrar',line:'Arrastra para trazar una línea',direct:'Toca un trazo o nodo · arrastra nodos y jaladores',conv:'Toca un nodo: curva ↔ recta · arrástralo para sacar jaladores',add:'Toca sobre el trazo para añadir un nodo',del:'Toca un nodo para quitarlo'};

/* ---------- geometría ---------- */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const mk=p=>({x:p.x,y:p.y,i:[0,0],o:[0,0],s:false});
const segPts=(a,b)=>[[a.x,a.y],[a.x+a.o[0],a.y+a.o[1]],[b.x+b.i[0],b.y+b.i[1]],[b.x,b.y]];
function segList(p){const n=p.nodes,r=[];for(let i=0;i<n.length-1;i++)r.push([n[i],n[i+1]]);if(p.closed&&n.length>1)r.push([n[n.length-1],n[0]]);return r}
function dOf(n,closed){if(!n.length)return'';let d=`M${n[0].x} ${n[0].y}`;for(const[a,b]of segList({nodes:n,closed})){const q=segPts(a,b);d+=`C${q[1][0]} ${q[1][1]} ${q[2][0]} ${q[2][1]} ${q[3][0]} ${q[3][1]}`}return d+(closed?'Z':'')}
function pathD(p){return dOf(p.nodes,p.closed)+(p.holes||[]).map(h=>dOf(h,true)).join('')}
function bzAt(q,t){const a=lerp(q[0],q[1],t),b=lerp(q[1],q[2],t),c=lerp(q[2],q[3],t);return lerp(lerp(a,b,t),lerp(b,c,t),t)}
const N=24;
function nearest(p,pt){let best={d:1e9};segList(p).forEach(([a,b],si)=>{const q=segPts(a,b);let prev=bzAt(q,0);for(let j=1;j<=N;j++){const c=bzAt(q,j/N),dx=c[0]-prev[0],dy=c[1]-prev[1],L=dx*dx+dy*dy;let u=L?((pt.x-prev[0])*dx+(pt.y-prev[1])*dy)/L:0;u=Math.max(0,Math.min(1,u));const d=Math.hypot(pt.x-(prev[0]+dx*u),pt.y-(prev[1]+dy*u));if(d<best.d)best={d,si,t:(j-1+u)/N};prev=c}});return best}
function inside(p,pt){const pts=[];segList(p).forEach(([a,b])=>{const q=segPts(a,b);for(let j=0;j<N;j++)pts.push(bzAt(q,j/N))});let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>pt.y)!=(yj>pt.y)&&pt.x<(xj-xi)*(pt.y-yi)/(yj-yi)+xi)c=!c}return c}
const conts=p=>[{nodes:p.nodes,closed:p.closed,owner:p}].concat((p.holes||[]).map(h=>({nodes:h,closed:true,owner:p})));
const cc=()=>{const n=(selH&&sel.holes&&sel.holes.includes(selH))?selH:sel.nodes;return{nodes:n,closed:n===sel.nodes?sel.closed:true,owner:sel}};
function hitPath(pt){const tol=14/view.s;for(let i=doc.paths.length-1;i>=0;i--){const p=doc.paths[i];if(conts(p).some(c=>c.nodes.length>1&&nearest(c,pt).d<=tol+p.sw/2))return p;if(p.closed&&p.fill!=='none'&&inside(p,pt)&&!(p.holes||[]).some(h=>inside({nodes:h,closed:true},pt)))return p}return null}
function hitNearest(pt,tol){let b=null;for(const p of doc.paths)for(const c of conts(p)){if(c.nodes.length<2)continue;const r=nearest(c,pt);if(r.d<tol&&(!b||r.d<b.d))b={p,c,si:r.si,t:r.t,d:r.d}}return b}
function nodeHit(pt,tol){const order=sel?[sel,...doc.paths.filter(x=>x!==sel).reverse()]:[...doc.paths].reverse();for(const p of order)for(const c of conts(p).reverse())for(let k=c.nodes.length-1;k>=0;k--)if(dist(c.nodes[k],pt)<tol)return{p,k,c};return null}
function handleAt(p,k,pt,tol){const n=p.nodes[k];for(const w of['o','i']){const h=n[w];if((h[0]||h[1])&&Math.hypot(n.x+h[0]-pt.x,n.y+h[1]-pt.y)<tol)return w}return null}
function visIdx(p){if(selN<0||selN>=p.nodes.length)return[];const n=p.nodes.length,r=[selN],a=selN-1,b=selN+1;if(a>=0)r.push(a);else if(p.closed)r.push(n-1);if(b<n)r.push(b);else if(p.closed)r.push(0);return[...new Set(r)]}
function setHandle(n,w,v){n[w]=v;if(n.s){const o=w==='i'?'o':'i',l=Math.hypot(...n[o])||Math.hypot(...v),m=Math.hypot(...v)||1;n[o]=[-v[0]/m*l,-v[1]/m*l]}}
function addNodeAt(p,si,t){const n=p.nodes,a=n[si],b=n[(si+1)%n.length],q=segPts(a,b);
 const straight=!a.o[0]&&!a.o[1]&&!b.i[0]&&!b.i[1];
 const L1=lerp(q[0],q[1],t),L2=lerp(q[1],q[2],t),L3=lerp(q[2],q[3],t),M1=lerp(L1,L2,t),M2=lerp(L2,L3,t),S=lerp(M1,M2,t);
 const nn={x:S[0],y:S[1],i:[0,0],o:[0,0],s:false};
 if(!straight){a.o=[L1[0]-q[0][0],L1[1]-q[0][1]];nn.i=[M1[0]-S[0],M1[1]-S[1]];nn.o=[M2[0]-S[0],M2[1]-S[1]];b.i=[L3[0]-q[3][0],L3[1]-q[3][1]];nn.s=true}
 n.splice(si+1,0,nn);return si+1}
function autoSmooth(p,k){const n=p.nodes,c=n[k],pr=n[k-1]||(p.closed?n[n.length-1]:null),nx=n[k+1]||(p.closed?n[0]:null);if(!pr&&!nx)return;
 const A=pr||c,B=nx||c;let tx=B.x-A.x,ty=B.y-A.y;const tl=Math.hypot(tx,ty)||1;tx/=tl;ty/=tl;
 const lo=nx?dist(c,nx)/3:0,li=pr?dist(c,pr)/3:0;c.o=[tx*lo,ty*lo];c.i=[-tx*li,-ty*li];c.s=true}
function delNode(c,k){const p=c.owner;c.nodes.splice(k,1);selN=-1;selH=null;
 if(c.nodes===p.nodes){if(c.nodes.length<2){doc.paths=doc.paths.filter(x=>x!==p);if(sel===p)sel=null;if(cur===p)cur=null}}
 else if(c.nodes.length<3){p.holes=p.holes.filter(h=>h!==c.nodes);if(!p.holes.length)delete p.holes}
 commit()}

/* ---------- historial / guardado ---------- */
function save(){try{localStorage.setItem('vec-doc',JSON.stringify(doc))}catch(e){}}
function commit(){H=H.slice(0,hi+1);H.push(JSON.stringify(doc));hi=H.length-1;if(H.length>80){H.shift();hi--}save();ui();draw()}
function restore(i){hi=i;doc=JSON.parse(H[i]);sel=null;selN=-1;cur=null;setArt();ui();draw()}
$('#undo').onclick=()=>{finishCur(true);if(hi>0)restore(hi-1)};
$('#redo').onclick=()=>{if(hi<H.length-1)restore(hi+1)};
$('#trash').onclick=()=>{if(!sel)return;doc.paths=doc.paths.filter(x=>x!==sel);if(cur===sel)cur=null;sel=null;selN=-1;commit()};
function finishCur(quiet){if(!cur)return;const c=cur;cur=null;if(c.nodes.length<2){doc.paths=doc.paths.filter(x=>x!==c);if(sel===c){sel=null;selN=-1}}if(!quiet)commit();else{ui();draw()}}
$('#fin').onclick=()=>finishCur();

/* ---------- interfaz ---------- */
function ui(){$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=H.length-1;$('#trash').disabled=!sel;$('#fin').style.display=cur?'inline-flex':'none';{const tg=cur||(hasSel()?sel:null);$('#close').hidden=!(tg&&!tg.closed&&tg.nodes.length>2)}$('#hand').classList.toggle('on',handOn);svg.style.cursor=handOn?'grab':refMove?'move':(tool==='pen'||tool==='line')?'crosshair':(tool==='conv'||tool==='add'||tool==='del')?'pointer':'default';
 $('#size').textContent=`${doc.w}×${doc.h}`;$('#hint').textContent=handOn?'Mano: arrastra para mover el lienzo · pellizca para hacer zoom':refMove?'Imagen: arrastra para moverla · pellizca para escalarla':HINT[tool];
 document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t===tool));updateSty()}
$('#tools').onclick=e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.t;if(t!==tool)finishCur();tool=t;handOn=false;ui();draw()};
function setArt(){art.setAttribute('width',doc.w);art.setAttribute('height',doc.h)}
function fit(){const W=innerWidth,Hh=innerHeight,top=topCol?22:$('.top').offsetHeight,bot=botCol?22:$('.bot').offsetHeight,av=Hh-top-bot-24;const s=Math.min((W-32)/doc.w,av/doc.h);view.s=s;view.ox=(W-doc.w*s)/2;view.oy=top+12+(av-doc.h*s)/2;draw()}

$('#size').onclick=()=>{$('#iw').value=doc.w;$('#ih').value=doc.h;dlg.returnValue='';dlg.showModal()};

let pend=null,tt;

/*BOOL*/
const dd=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]),FL=24;
const segsOf=nodes=>nodes.map((a,i)=>segPts(a,nodes[(i+1)%nodes.length]));
const polyOf=S=>S.flatMap(q=>Array.from({length:FL},(_,j)=>bzAt(q,j/FL)));
function area(P){let a=0;for(let i=0,j=P.length-1;i<P.length;j=i++)a+=P[j][0]*P[i][1]-P[i][0]*P[j][1];return a/2}
function inPoly(P,pt){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if((yi>pt[1])!=(yj>pt[1])&&pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi)c=!c}return c}
const cloneN=n=>n.map(x=>({x:x.x,y:x.y,i:[...x.i],o:[...x.o],s:x.s}));
const revN=n=>n.map(x=>({x:x.x,y:x.y,i:[...x.o],o:[...x.i],s:x.s})).reverse();
function orient(n){n=cloneN(n);return area(polyOf(segsOf(n)))<0?revN(n):n}
function segX(p,q,r,s){const d1=[q[0]-p[0],q[1]-p[1]],d2=[s[0]-r[0],s[1]-r[1]],den=d1[0]*d2[1]-d1[1]*d2[0];if(Math.abs(den)<1e-12)return null;const t=((r[0]-p[0])*d2[1]-(r[1]-p[1])*d2[0])/den,u=((r[0]-p[0])*d1[1]-(r[1]-p[1])*d1[0])/den;return t>=0&&t<=1&&u>=0&&u<=1?[t,u]:null}
function dbz(q,t){const m=1-t;return[0,1].map(c=>3*(m*m*(q[1][c]-q[0][c])+2*m*t*(q[2][c]-q[1][c])+t*t*(q[3][c]-q[2][c])))}
function refine(qa,qb,ta,tb){for(let n=0;n<6;n++){const A=bzAt(qa,ta),B=bzAt(qb,tb),f0=A[0]-B[0],f1=A[1]-B[1],da=dbz(qa,ta),db=dbz(qb,tb),det=-da[0]*db[1]+db[0]*da[1];if(Math.abs(det)<1e-12)break;
 ta=Math.max(0,Math.min(1,ta+(f0*db[1]-db[0]*f1)/det));tb=Math.max(0,Math.min(1,tb+(-da[0]*f1+da[1]*f0)/det))}return[ta,tb]}
function xsect(SA,SB){const r=[],fl=q=>Array.from({length:FL+1},(_,j)=>bzAt(q,j/FL)),FB=SB.map(fl);
 SA.forEach((qa,i)=>{const pa=fl(qa);SB.forEach((qb,k)=>{const pb=FB[k];for(let a=0;a<FL;a++)for(let b=0;b<FL;b++){const h=segX(pa[a],pa[a+1],pb[b],pb[b+1]);if(h){const[ta,tb]=refine(qa,qb,(a+h[0])/FL,(b+h[1])/FL);r.push({i,ta,k,tb})}}})});return r}
function splitAt(q,t){const L1=lerp(q[0],q[1],t),L2=lerp(q[1],q[2],t),L3=lerp(q[2],q[3],t),M1=lerp(L1,L2,t),M2=lerp(L2,L3,t),S=lerp(M1,M2,t);return[[q[0],L1,M1,S],[S,M2,L3,q[3]]]}
function pieces(S,cuts){const out=[];S.forEach((q,i)=>{const ts=[];(cuts[i]||[]).slice().sort((a,b)=>a-b).forEach(t=>{if(t>.002&&t<.998&&(!ts.length||t-ts[ts.length-1]>.001))ts.push(t)});let prev=0,rest=q;for(const t of ts){const[l,r]=splitAt(rest,(t-prev)/(1-prev));out.push(l);rest=r;prev=t}out.push(rest)});return out}
const rev=q=>[q[3],q[2],q[1],q[0]];
function loops(ps){const used=new Set(),res=[],tol=.1;for(let s=0;s<ps.length;s++){if(used.has(s))continue;used.add(s);const ch=[ps[s]];let end=ps[s][3],ok=false;

const straight=q=>{const dx=q[3][0]-q[0][0],dy=q[3][1]-q[0][1],L=Math.hypot(dx,dy)||1;return Math.abs(dx*(q[1][1]-q[0][1])-dy*(q[1][0]-q[0][0]))/L<.01&&Math.abs(dx*(q[2][1]-q[0][1])-dy*(q[2][0]-q[0][0]))/L<.01};
function toNodes(ch){const n=ch.length;return ch.map((q,k)=>{const pv=ch[(k+n-1)%n],o=straight(q)?[0,0]:[q[1][0]-q[0][0],q[1][1]-q[0][1]],i=straight(pv)?[0,0]:[pv[2][0]-pv[3][0],pv[2][1]-pv[3][1]],lo=Math.hypot(...o),li=Math.hypot(...i);

function bool(op,A,B){const na=orient(A.nodes),nb=orient(B.nodes),SA=segsOf(na),SB=segsOf(nb),pa=polyOf(SA),pb=polyOf(SB),X=xsect(SA,SB);

  if(op==='add')return ain?{outer:[nb],holes:[]}:bin?{outer:[na],holes:[]}:null;
  return ain?{outer:[],holes:[]}:bin?{outer:[na],holes:[nb]}:null}
 const ca={},cb={};X.forEach(x=>{(ca[x.i]=ca[x.i]||[]).push(x.ta);(cb[x.k]=cb[x.k]||[]).push(x.tb)});
 const keep=[];
 for(const q of pieces(SA,ca))if(!inPoly(pb,bzAt(q,.5)))keep.push(q);
 for(const q of pieces(SB,cb)){const ins=inPoly(pa,bzAt(q,.5));if(op==='add'?!ins:ins)keep.push(op==='add'?q:rev(q))}
 const r={outer:[],holes:[]};for(const ch of loops(keep))(area(polyOf(ch))>0?r.outer:r.holes).push(toNodes(ch));
 return r.outer.length||r.holes.length?r:null}
/*ENDBOOL*/

function startOp(op){finishCur();if(!hasSel()||!sel.closed){toast('Selecciona primero una forma cerrada');return}pend=op;styOpen=false;updateSty();toast(op==='add'?'Toca la forma que quieres sumar':'Toca la forma que quieres restar')}
$('#badd').onclick=()=>startOp('add');$('#bsub').onclick=()=>startOp('sub');
function doBool(op,A,B){let r;try{r=bool(op,A,B)}catch(e){r=null}
 if(!r){toast('No se pudo: las formas no se cruzan');draw();return}
 const idx=doc.paths.indexOf(A);doc.paths=doc.paths.filter(x=>x!==A&&x!==B);
 const outs=r.outer.map(nodes=>({id:nid++,nodes,closed:true,fill:A.fill,stroke:A.stroke,sw:A.sw}));
 if(outs.length&&r.holes.length)outs[0].holes=r.holes;
 doc.paths.splice(Math.min(idx,doc.paths.length),0,...outs);sel=outs[0]||null;selN=-1;
 if(!outs.length)toast('El resultado quedó vacío');else if((A.holes&&A.holes.length)||(B.holes&&B.holes.length))toast('Nota: los huecos de las formas originales no pasan al resultado');commit()}
